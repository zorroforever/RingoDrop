name: Build & Attach macOS Release Assets

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build RingoDrop.app (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RingoDrop.app bundle & AppIcon.icns
        run: |
          chmod +x scripts/build_app.sh scripts/generate_icon.swift
          ./scripts/build_app.sh --no-install

      - name: Package macOS .zip and .dmg
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v1.0.1"
          fi
          echo "RELEASE_TAG=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist dmg_root
          ditto -c -k --sequesterRsrc --keepParent build/RingoDrop.app "dist/RingoDrop-${VERSION}-macOS.zip"
          cp -R build/RingoDrop.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "RingoDrop りんご雫" -srcfolder dmg_root -ov -format UDZO "dist/RingoDrop-${VERSION}-macOS.dmg"

      - name: Upload .dmg and .zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "🍎💧 RingoDrop (りんご雫) ${{ env.RELEASE_TAG }}"
          body: |
            ## 🍎💧 RingoDrop（りんご雫 / 林檎雫）${{ env.RELEASE_TAG }}

            **macOS 原生 SwiftUI Liquid Glass 风格的 App Store `.ipa` 多国联合搜索、三国账号切换与已下架应用提取工具**  
            *A native macOS Liquid Glass App Store `.ipa` downloader, CN/JP/US multi-account switcher & delisted app extractor.*

            > **⚠️ 免责声明（Disclaimer）**  
            > 1. 本软件及源码**仅限用于协助用户找回自己合法购买/获取过但丢失的 App 安装包备份，以及个人非商业性质的技术学习与研究，严禁用于其他任何用途**。  
            > 2. 本工具不提供任何破解或绕过 Apple FairPlay DRM 的功能，下载的 `.ipa` 均保留与用户本人 Apple ID 强绑定的官方 `sinf` 授权签名，仅能在该账号本人授权的设备上安装运行。

            ---

            ### 🆕 ${{ env.RELEASE_TAG }} 更新日志 | What's New
            - **🌐 中 / 日 / 英 三语言支持 (i18n)**：默认自动跟随 macOS 系统语言（简体中文 / 日本語 / English），并可在顶栏胶囊菜单随时手动一键切换。
            - **🏷️ 主界面版本号徽章**：在顶栏品牌区直接展示当前版本号 `v1.0.1`。
            - **📦 已购列表全量分批加载与分页增强**：修复超过 40 款已购应用时的图标与三区在架状态同步截断问题，支持 500+ 已购项目分页拉取与核验状态保护。
            - **🎨 全新 Liquid Glass 应用图标 (`AppIcon.icns`)**：内置 `1024×1024` 晶莹苹果露珠 Retina 图标集。

            ---

            ### 📦 安装说明 | Installation
            1. 先通过 Homebrew 安装底层依赖：`brew install ipatool`
            2. 下载下方 `Assets` 中的 **`RingoDrop-${{ env.RELEASE_TAG }}-macOS.dmg`**（或 `.zip`），将 **`RingoDrop.app`** 拖入 `Applications`（应用程序）即可运行。
            3. 首次打开若 macOS 提示无法验证开发者，在终端执行 `xattr -cr /Applications/RingoDrop.app` 即可正常打开。
          files: |
            dist/RingoDrop-*.dmg
            dist/RingoDrop-*.zip
          draft: false
          prerelease: false
